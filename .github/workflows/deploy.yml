name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 凌晨任务：北京时间每天 01:07（UTC 前一天 17:07），避开 GitHub Actions 整点高峰
    - cron: '7 17 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 午间任务：北京时间每天 11:40（UTC 03:40）
    #- cron: '40 3 * * *'
    # 晚间任务：北京时间每天 22:00（UTC 14:00）
    #- cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境（不存在时 GitHub 会自动创建）
    # 兜底超时：会话上限 3 小时 + 启动抖动 45 分钟，正常远小于该值
    timeout-minutes: 240

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run deployment script
      env:
        # 让脚本日志打印北京时间（runner 默认 UTC，日志时间戳会让人误判执行时刻）
        TZ: "Asia/Shanghai"
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables
        # 启动随机抖动上限（秒）：触发后随机休眠 0-45 分钟，避免固定分钟级时刻运行
        # 可在 Repository Variables 中配置 START_JITTER_MAX 覆盖（设 0 禁用）
        START_JITTER_MAX: ${{ vars.START_JITTER_MAX || '2700' }}
        # 可选：官方 Agent Gateway API Key（wrk- 开头），配置后推送"今日实际计入时长"
        WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}

      run: |
        python main.py

    # P1-4：cookie 持久化回写（可选）
    # main.py 运行结束会把续期后的最新 cookie 导出到 latest_cookie.txt；
    # 配置了 PAT_TOKEN secret（需 repo 权限）时自动回写 WXREAD_CURL_BASH，
    # 延长免重新抓包的周期。注意：默认 GITHUB_TOKEN 无权修改 secrets，必须自建 PAT。
    # 注意：secrets 上下文不能用于 if 表达式（workflow 校验会报
    # Unrecognized named-value），因此这里用 always() + 脚本内判断 token 是否为空。
    - name: Persist refreshed cookie
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "未配置 PAT_TOKEN，跳过 cookie 回写。"
          exit 0
        fi
        if [ -f latest_cookie.txt ]; then
          gh secret set WXREAD_CURL_BASH < latest_cookie.txt
          echo "WXREAD_CURL_BASH secret 已用最新 cookie 更新。"
        else
          echo "latest_cookie.txt 不存在，跳过回写。"
        fi

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
